name: Feed Patrol

on:
  workflow_dispatch:
  schedule:
    # 多路错峰唤醒 + 四班连环接力（单次唤醒保底连续值守 22 小时，排队信号无缝衔接下一轮 22 小时）
    - cron: "12 */2 * * *"
    - cron: "42 */3 * * *"
    - cron: "55 23 * * *"

permissions:
  contents: write

concurrency:
  group: feed-patrol
  cancel-in-progress: false

jobs:
  shift_1:
    name: Patrol Shift 1 (0h - 5.5h)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "qrcode[pil]" pillow
      - name: Run 5.5-hour continuous patrol (Shift 1)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          MONITOR_TARGETS_JSON: ${{ secrets.MONITOR_TARGETS_JSON }}
          BARK_MODE: silent_pin
        run: python3 wechat_monitor.py --burst-seconds 19800 --burst-interval 0

  shift_2:
    name: Patrol Shift 2 (5.5h - 11h)
    needs: shift_1
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "qrcode[pil]" pillow
      - name: Run 5.5-hour continuous patrol (Shift 2)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          MONITOR_TARGETS_JSON: ${{ secrets.MONITOR_TARGETS_JSON }}
          BARK_MODE: silent_pin
        run: python3 wechat_monitor.py --burst-seconds 19800 --burst-interval 0

  shift_3:
    name: Patrol Shift 3 (11h - 16.5h)
    needs: shift_2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "qrcode[pil]" pillow
      - name: Run 5.5-hour continuous patrol (Shift 3)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          MONITOR_TARGETS_JSON: ${{ secrets.MONITOR_TARGETS_JSON }}
          BARK_MODE: silent_pin
        run: python3 wechat_monitor.py --burst-seconds 19800 --burst-interval 0

  shift_4:
    name: Patrol Shift 4 (16.5h - 22h)
    needs: shift_3
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "qrcode[pil]" pillow
      - name: Run 5.5-hour continuous patrol (Shift 4)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          MONITOR_TARGETS_JSON: ${{ secrets.MONITOR_TARGETS_JSON }}
          BARK_MODE: silent_pin
        run: python3 wechat_monitor.py --burst-seconds 19800 --burst-interval 0
