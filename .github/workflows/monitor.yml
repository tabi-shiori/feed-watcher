name: Feed Patrol

on:
  workflow_dispatch:
  schedule:
    # 多路错峰唤醒 + 5.5 小时超长常驻容器接力模式：
    # 即使 GitHub 定时调度器隔 2~4 小时才触发一次，也会在当前 5.5 小时常驻容器运行期间进入等待队列，
    # 在上一棒结束瞬间无缝接力启动下一棒，实现 24 小时不间断的“每 60 秒”实时巡检！
    - cron: "12 * * * *"
    - cron: "42 * * * *"
    - cron: "55 23 * * *"

permissions:
  contents: write

concurrency:
  group: feed-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests "qrcode[pil]" pillow

      - name: Run 5.5-hour continuous patrol daemon (60s interval) & instant Bark push
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          MONITOR_TARGETS_JSON: ${{ secrets.MONITOR_TARGETS_JSON }}
          BARK_MODE: silent_pin
        run: |
          python3 wechat_monitor.py --burst-seconds 19800 --burst-interval 60

      - name: Persist deduplication hashes on exit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): update seen item hashes [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
